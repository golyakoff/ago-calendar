name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# A branch with a red job here cannot show green - this workflow's name is what a GitHub branch
# protection rule requires (../ago-root/docs/conventions/git-workflow.md).
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # This build proves it restores Ago.Platform.* as a real, published .nupkg
      # (nuget.ci.config), never as a ProjectReference - the whole point of AGO Calendar being the
      # second product on the platform rather than a folder inside the first. AgoCalendarDevOverride
      # is never set here, so the dev-override branch of every .csproj (Directory.Build.props) stays
      # off; a branch merged with it left on fails exactly here (repositories.md).
      # AGO_PLATFORM_PACKAGES_TOKEN is a repository secret: a classic PAT scoped to read:packages
      # only (adr/0018) - GitHub does not allow anonymous reads of NuGet packages even on a public
      # repository.
      - name: Restore
        run: dotnet restore Ago.Calendar.slnx --configfile nuget.ci.config
        env:
          AGO_PLATFORM_PACKAGES_TOKEN: ${{ secrets.AGO_PLATFORM_PACKAGES_TOKEN }}

      # 17-04: same policy as ago-platform's and ago-chat's own CI, stated in full in ago-platform's
      # ci.yml and in docs/runbooks/vulnerability-response.md (ago-root) - Critical/High fails the
      # build, Moderate/Low is reported (job log + step summary) but does not, because a check that
      # blocks every branch on an untriaged transitive Low advisory nobody can act on trains people to
      # ignore red CI rather than read it. `--format json` rather than the command's own exit code
      # (always 0) or its human-readable text (locale-dependent).
      - name: Vulnerability check (dotnet list package --vulnerable)
        run: |
          set -euo pipefail
          dotnet list Ago.Calendar.slnx package --vulnerable --include-transitive --no-restore \
            --configfile nuget.ci.config --format json --output-version 1 > vulnerable.json
        env:
          AGO_PLATFORM_PACKAGES_TOKEN: ${{ secrets.AGO_PLATFORM_PACKAGES_TOKEN }}

      - name: Report and gate on Critical/High
        run: |
          set -euo pipefail
          total=$(jq '[ .projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? ] | length' vulnerable.json)
          high_critical=$(jq '[ .projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? | select(.severity=="Critical" or .severity=="High") ] | length' vulnerable.json)

          echo "Vulnerable package references: $total total, $high_critical at Critical/High."
          jq -r '.projects[] as $p | ($p.frameworks[]? // empty) as $f | (($f.topLevelPackages[]? // empty), ($f.transitivePackages[]? // empty)) | . as $pkg | $pkg.vulnerabilities[]? | "  \($p.path | split("/") | last)  \($pkg.id) \($pkg.resolvedVersion // $pkg.requestedVersion)  \(.severity)  \(.advisoryurl)"' vulnerable.json

          {
            echo "### Dependency vulnerability check"
            echo
            echo "$total vulnerable package reference(s), $high_critical at Critical/High severity."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$high_critical" -gt 0 ]; then
            echo "::error::$high_critical package(s) at Critical/High severity - failing the build. See the list above."
            exit 1
          fi

      # Runs before build so a formatting-only branch fails fast, before paying for compilation.
      - name: Format check
        run: dotnet format Ago.Calendar.slnx --verify-no-changes

      - name: Build
        run: dotnet build Ago.Calendar.slnx --no-restore -c Release

      # Ago.Calendar.Architecture.Tests is an ordinary test project in this solution, so the
      # layering rules and adr/0027's Ago.Chat.* isolation rule run here with no separate job.
      #
      # `20-01`: Ago.Calendar.Integration.Tests joins them, and it starts a real Postgres through
      # Testcontainers. No extra setup step - ubuntu-latest ships a running Docker daemon, which is
      # exactly how ago-chat's own integration suite has run in CI since `1-04`. If a runner image
      # ever stops providing one, this step is where it will show up, and the honest fix is a
      # service container rather than skipping the tests: the overlap guarantee has no in-memory
      # equivalent to fall back to.
      - name: Test
        run: >
          dotnet test Ago.Calendar.slnx --no-build -c Release
          --logger trx --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
