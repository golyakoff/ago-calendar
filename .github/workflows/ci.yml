name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# A branch with a red job here cannot show green - this workflow's name is what a GitHub branch
# protection rule requires (../ago-root/docs/conventions/git-workflow.md).
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # This build proves it restores Ago.Platform.* as a real, published .nupkg
      # (nuget.ci.config), never as a ProjectReference - the whole point of AGO Calendar being the
      # second product on the platform rather than a folder inside the first. AgoCalendarDevOverride
      # is never set here, so the dev-override branch of every .csproj (Directory.Build.props) stays
      # off; a branch merged with it left on fails exactly here (repositories.md).
      # AGO_PLATFORM_PACKAGES_TOKEN is a repository secret: a classic PAT scoped to read:packages
      # only (adr/0018) - GitHub does not allow anonymous reads of NuGet packages even on a public
      # repository.
      - name: Restore
        run: dotnet restore Ago.Calendar.slnx --configfile nuget.ci.config
        env:
          AGO_PLATFORM_PACKAGES_TOKEN: ${{ secrets.AGO_PLATFORM_PACKAGES_TOKEN }}

      # 17-04: same policy as ago-platform's and ago-chat's own CI, stated in full in ago-platform's
      # ci.yml and in docs/runbooks/vulnerability-response.md (ago-root) - Critical/High fails the
      # build, Moderate/Low is reported (job log + step summary) but does not, because a check that
      # blocks every branch on an untriaged transitive Low advisory nobody can act on trains people to
      # ignore red CI rather than read it. `--format json` rather than the command's own exit code
      # (always 0) or its human-readable text (locale-dependent).
      - name: Vulnerability check (dotnet list package --vulnerable)
        run: |
          set -euo pipefail
          dotnet list Ago.Calendar.slnx package --vulnerable --include-transitive --no-restore \
            --configfile nuget.ci.config --format json --output-version 1 > vulnerable.json
        env:
          AGO_PLATFORM_PACKAGES_TOKEN: ${{ secrets.AGO_PLATFORM_PACKAGES_TOKEN }}

      - name: Report and gate on Critical/High
        run: |
          set -euo pipefail
          total=$(jq '[ .projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? ] | length' vulnerable.json)
          high_critical=$(jq '[ .projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? | select(.severity=="Critical" or .severity=="High") ] | length' vulnerable.json)

          echo "Vulnerable package references: $total total, $high_critical at Critical/High."
          jq -r '.projects[] as $p | ($p.frameworks[]? // empty) as $f | (($f.topLevelPackages[]? // empty), ($f.transitivePackages[]? // empty)) | . as $pkg | $pkg.vulnerabilities[]? | "  \($p.path | split("/") | last)  \($pkg.id) \($pkg.resolvedVersion // $pkg.requestedVersion)  \(.severity)  \(.advisoryurl)"' vulnerable.json

          {
            echo "### Dependency vulnerability check"
            echo
            echo "$total vulnerable package reference(s), $high_critical at Critical/High severity."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$high_critical" -gt 0 ]; then
            echo "::error::$high_critical package(s) at Critical/High severity - failing the build. See the list above."
            exit 1
          fi

      # Runs before build so a formatting-only branch fails fast, before paying for compilation.
      - name: Format check
        run: dotnet format Ago.Calendar.slnx --verify-no-changes

      - name: Build
        run: dotnet build Ago.Calendar.slnx --no-restore -c Release

      # Ago.Calendar.Architecture.Tests is an ordinary test project in this solution, so the
      # layering rules and adr/0027's Ago.Chat.* isolation rule run here with no separate job.
      #
      # `20-01`: Ago.Calendar.Integration.Tests joins them, and it starts a real Postgres through
      # Testcontainers. No extra setup step - ubuntu-latest ships a running Docker daemon, which is
      # exactly how ago-chat's own integration suite has run in CI since `1-04`. If a runner image
      # ever stops providing one, this step is where it will show up, and the honest fix is a
      # service container rather than skipping the tests: the overlap guarantee has no in-memory
      # equivalent to fall back to.
      - name: Test
        run: >
          dotnet test Ago.Calendar.slnx --no-build -c Release
          --logger trx --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  # `20-20`/`adr/0047`: images are published to GHCR from here, not built on the deployment node -
  # the same job ago-chat's own CI runs (`15-06`), ported unchanged in shape. Only on `main`, and only
  # after build-test passed - a pull request never publishes, so a fork or a draft branch cannot put
  # an image into the registry a deploy might later reach for.
  publish-images:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A repository's own GITHUB_TOKEN can write to that repository's own package feed - the same
      # property adr/0018 already relies on for the NuGet feed, so publishing needs no new secret.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The Dockerfile restores Ago.Platform.* from a *folder* mounted in as a Buildx build context
      # (nuget.docker.config), because the local developer loop's feed lives outside the build
      # context. CI has no such folder - it restores from GitHub Packages - so materialise one:
      # restore into a scratch global-packages directory and copy the .nupkg files out of it. The
      # alternative, teaching the Dockerfile to authenticate against GitHub Packages itself, would
      # push AGO_PLATFORM_PACKAGES_TOKEN into the image build, and a token that never enters a build
      # cannot leak from a layer.
      - name: Materialise the Ago.Platform.* feed for the image build
        env:
          AGO_PLATFORM_PACKAGES_TOKEN: ${{ secrets.AGO_PLATFORM_PACKAGES_TOKEN }}
        run: |
          mkdir -p /tmp/nuget-feed
          dotnet restore Ago.Calendar.slnx --configfile nuget.ci.config --packages /tmp/global-packages
          find /tmp/global-packages -name 'ago.platform.*.nupkg' -exec cp {} /tmp/nuget-feed/ \;
          ls -1 /tmp/nuget-feed

      # No docker/login-action: `docker login` with the workflow token does the same thing with one
      # fewer third-party action in the supply chain, and Buildx is already installed on the runner.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tagging (adr/0047): the canonical tag is the full 40-character commit SHA. Plain `docker
      # build` with BuildKit and a separate `docker push`, rather than `buildx build --push`: this is
      # byte-for-byte what a developer machine or a redeploy script would run by hand, so an image
      # built by CI and one built locally come out of the same command. --build-context is the reason
      # BuildKit is required at all (the Ago.Platform.* feed is a folder outside the build context,
      # per the Dockerfile's header).
      # `ago-root#363`: Ago.Calendar.Provisioner joins the loop below - it never listens on a port
      # and is never routed to (see that project's own remarks), so publishing its image costs
      # nothing this pipeline was not already paying for the other one-shot host, Migrator.
      - name: Build the four host images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          for project in Ago.Calendar.Api Ago.Calendar.Worker Ago.Calendar.Migrator Ago.Calendar.Provisioner; do
            name="ago-calendar-$(echo "${project#Ago.Calendar.}" | tr '[:upper:]' '[:lower:]')"
            repo="ghcr.io/${{ github.repository_owner }}/${name}"
            echo "::group::${repo}"
            docker build \
              --build-context "nugetfeed=/tmp/nuget-feed" \
              --build-arg "PROJECT_NAME=${project}" \
              --build-arg "GIT_COMMIT=${{ github.sha }}" \
              -t "${repo}:${{ github.sha }}" \
              -t "${repo}:main" \
              .
            echo "::endgroup::"
          done

      # `17-04`, and `15-06`/`adr/0047` is what makes it possible - there was nowhere to scan into
      # before a registry existed. Runs between build and push, not after push: nothing this check
      # would fail ever reaches the registry from this pipeline. Same threshold as the dependency
      # check above (Critical/High fails, Moderate/Low is reported -
      # docs/runbooks/vulnerability-response.md in ago-root) and `--scanners vuln` only, deliberately
      # out of scope for secret scanning of source.
      #
      # Pinned by digest, not by a version tag or the `aquasecurity/trivy-action` wrapper - same
      # reasoning and the same digest ago-chat's own workflow pins (`aquasec/trivy:0.74.0`, verified
      # there well past the 2026-03 supply-chain compromise of both the Action's git tags and the
      # Docker Hub image). Dependabot's github-actions/docker entries will not bump a `docker run`
      # invocation like this one, so this digest needs updating by hand when it goes stale - a real
      # limitation of choosing the CLI form over the Action, stated rather than hidden.
      - name: Scan images for known vulnerabilities (Trivy)
        run: |
          set -euo pipefail
          fail=0
          for project in Ago.Calendar.Api Ago.Calendar.Worker Ago.Calendar.Migrator Ago.Calendar.Provisioner; do
            name="ago-calendar-$(echo "${project#Ago.Calendar.}" | tr '[:upper:]' '[:lower:]')"
            repo="ghcr.io/${{ github.repository_owner }}/${name}"
            echo "::group::${repo}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 --format table \
              "${repo}:${{ github.sha }}" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::At least one image has a Critical/High vulnerability - see the groups above. Nothing was pushed."
            exit 1
          fi

      - name: Push the four host images
        run: |
          set -euo pipefail
          for n in api worker migrator provisioner; do
            repo="ghcr.io/${{ github.repository_owner }}/ago-calendar-${n}"
            docker push "${repo}:${{ github.sha }}"
            docker push "${repo}:main"
          done

      - name: Summarise what was published
        run: |
          {
            echo "### Images published"
            echo
            for n in api worker migrator provisioner; do
              echo "- \`ghcr.io/${{ github.repository_owner }}/ago-calendar-${n}:${{ github.sha }}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
